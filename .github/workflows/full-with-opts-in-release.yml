name: Build full-with-opts-in release

run-name: full-with-opts-in v3.2.2-r2 Geo3D+XML from ${{ github.ref_name }} (${{ github.run_number }})

on:
  # Build the complete v3.2.2-r2 opt-in offline distribution (including Geo3D and XML).
  push:
    branches:
      - build/web-full-with-opts-in
    paths:
      - .github/workflows/full-with-opts-in-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-with-opts-in-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # The opt-in wrappers are branch-specific and add new workspace importers.
      # Reconcile the lockfile in the runner and retain it for reproducibility.
      - name: Install dependencies and resolve workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Save resolved lockfile in release bundle
        env:
          OUT_DIR: ${{ runner.temp }}/full-with-opts-in-release
        run: |
          mkdir -p "$OUT_DIR"
          cp pnpm-lock.yaml "$OUT_DIR/resolved-pnpm-lock.yaml"

      - name: Verify the release dependency closure excludes AGPL CAD
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs'
          import { join } from 'node:path'

          const forbidden = new Set([
            '@file-viewer/renderer-cad',
            '@file-viewer/assets-cad',
            '@flyfish-dev/cad-viewer',
            'dwf-viewer'
          ])

          const roots = ['packages']
          const packageByName = new Map()

          for (const root of roots) {
            for (const path of readdirSync(root, { recursive: true, withFileTypes: false })) {
              if (!String(path).endsWith('package.json')) continue
              const file = join(root, String(path))
              try {
                const pkg = JSON.parse(readFileSync(file, 'utf8'))
                if (pkg.name) packageByName.set(pkg.name, { file, pkg })
              } catch {}
            }
          }

          const entry = '@file-viewer/preset-full-with-opts-in'
          const seen = new Set()
          const stack = [entry]
          const violations = []

          while (stack.length) {
            const name = stack.pop()
            if (!name || seen.has(name)) continue
            seen.add(name)
            if (forbidden.has(name)) violations.push(name)

            const record = packageByName.get(name)
            if (!record) continue
            const deps = {
              ...(record.pkg.dependencies || {}),
              ...(record.pkg.optionalDependencies || {}),
              ...(record.pkg.peerDependencies || {})
            }
            for (const dep of Object.keys(deps)) {
              if (forbidden.has(dep)) violations.push(`${name} -> ${dep}`)
              if (packageByName.has(dep)) stack.push(dep)
            }
          }

          if (violations.length) {
            console.error('Forbidden CAD dependency found in full-with-opts-in closure:')
            for (const violation of [...new Set(violations)]) console.error(`- ${violation}`)
            process.exit(1)
          }

          console.log(`Verified ${seen.size} workspace packages: no AGPL CAD runtime dependency in the full-with-opts-in closure.`)
          NODE

      - name: Set up Rust WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Set up pinned Binaryen WASM optimizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tool_dir="$RUNNER_TEMP/file-viewer-binaryen"
          archive="$tool_dir/binaryen-version_132-node.tar.gz"
          mkdir -p "$tool_dir"
          gh release download version_132 \
            --repo WebAssembly/binaryen \
            --pattern binaryen-version_132-node.tar.gz \
            --dir "$tool_dir"
          printf '%s  %s\n' \
            'f2f49e583f5eafbe2af5da8470177d4d10aedf149752f5dd97736f54eba6f6a2' \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$tool_dir"
          printf '%s\n' '#!/usr/bin/env bash' \
            "exec node '$tool_dir/binaryen-version_132/wasm-opt.js' \"\$@\"" \
            > "$tool_dir/wasm-opt"
          chmod +x "$tool_dir/wasm-opt"
          "$tool_dir/wasm-opt" --version
          echo "$tool_dir" >> "$GITHUB_PATH"

      # Upstream 3.2.2 retained-license staging validates generated Workers.
      # Its standard asset pack also requires the staged manifest before it builds.
      # Require the v3.2.2-pinned IFC peer engine cohort in the preset.
      # Prebuild the three notice-bearing Workers AND the OCCT geometry bundle.
      # The upstream 3.2.2 asset stager verifies OCCT's generated LGPL notice
      # before copying assets; a source-only checkout lacks that notice.
      - name: Build core and license-verified Worker prerequisites
        run: |
          pnpm --filter @file-viewer/core build
          pnpm --filter @file-viewer/renderer-iwork --filter @file-viewer/renderer-hangul --filter @file-viewer/renderer-spreadsheet build
          pnpm --filter @file-viewer/geometry-engine build
          # Flyfish's immutable runtime attribution requires generated original
          # PDF.js grants and specialist Worker payloads before asset staging.
          pnpm --filter @file-viewer/renderer-pdf... build
          pnpm --filter @file-viewer/renderer-design... build
          pnpm --filter @file-viewer/renderer-chm... build
          pnpm --filter @file-viewer/renderer-media... build

      - name: Stage runtime assets for the standard pack
        run: pnpm --filter file-viewer-copy-assets stage-assets

      - name: Build full-with-opts-in dependency closure
        run: pnpm --filter @file-viewer/preset-full-with-opts-in... build

      - name: Build base framework components for opt-in wrappers
        run: |
          pnpm --filter @file-viewer/web \
            --filter @file-viewer/vue3 \
            --filter @file-viewer/vue2.7 \
            --filter @file-viewer/vue2.6 \
            --filter @file-viewer/react \
            --filter @file-viewer/react-legacy \
            --filter @file-viewer/jquery \
            --filter @file-viewer/svelte build

      - name: Enable jQuery ambient types for opt-in wrapper (runner only)
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'packages/components/jquery-full-with-opts-in/tsconfig.json'
          const config = JSON.parse(readFileSync(path, 'utf8'))
          config.compilerOptions.types = [
            ...new Set([...(config.compilerOptions.types || []), 'jquery'])
          ]
          writeFileSync(path, JSON.stringify(config, null, 2) + '\n')
          NODE

      - name: Build full-with-opts-in wrappers
        run: pnpm --filter './packages/components/*-full-with-opts-in' build

      - name: Type-check new release line
        run: |
          pnpm --filter @file-viewer/preset-full-with-opts-in type-check
          pnpm --filter './packages/components/*-full-with-opts-in' type-check

      - name: Verify specialist opt-ins
        run: |
          pnpm verify:dicom-license-ledger
          pnpm --filter @file-viewer/renderer-3d verify:ifc
          pnpm --filter @file-viewer/renderer-signature verify:licenses

      # Exercise Flyfish's own Geo3D contracts and the real Chromium XSD/XSLT
      # browser fixture; this guards against missing optional peers and loaders.
      - name: Verify Geo3D point cloud and 3TZ opt-in
        run: pnpm --filter @file-viewer/renderer-3d verify:geo3d

      - name: Install Chromium for real XML XSD/XSLT fixture
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify XML XSD/XSLT profile rendering in Chromium
        run: pnpm --filter @file-viewer/renderer-text test:xml-profiles:browser

      - name: Pack release tarballs
        env:
          OUT_DIR: ${{ runner.temp }}/full-with-opts-in-release
        run: |
          mkdir -p "$OUT_DIR"
          packages=(
            '@file-viewer/preset-full-with-opts-in'
            '@file-viewer/web-full-with-opts-in'
            '@file-viewer/vue3-full-with-opts-in'
            '@file-viewer/vue2.7-full-with-opts-in'
            '@file-viewer/vue2.6-full-with-opts-in'
            '@file-viewer/react-full-with-opts-in'
            '@file-viewer/react-legacy-full-with-opts-in'
            '@file-viewer/jquery-full-with-opts-in'
            '@file-viewer/svelte-full-with-opts-in'
          )
          for package in "${packages[@]}"; do
            pnpm --filter "$package" pack --pack-destination "$OUT_DIR"
          done

      # The upstream distribution is compiled packages PLUS version-matched
      # Worker/WASM/font/vendor asset packs. Stage specialist packs before using
      # the preset's own transactional asset installers.
      - name: Stage optional offline asset packs
        run: |
          for capability in typst model drawing iwork ppt hangul wordperfect chm data design; do
            pnpm --filter "@file-viewer/assets-$capability" stage-assets
          done

      # Resolve deployed pnpm modules through their nested production closure.
      - name: Assemble and verify full offline distribution
        env:
          OUT_DIR: ${{ runner.temp }}/full-with-opts-in-release
        run: node .github/scripts/build-full-with-opts-in-offline.mjs

      - name: Generate manifest and checksums
        env:
          OUT_DIR: ${{ runner.temp }}/full-with-opts-in-release
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readdir, writeFile } from 'node:fs/promises'
          import { createReadStream } from 'node:fs'
          import { basename, join } from 'node:path'

          const root = process.env.OUT_DIR
          const names = await readdir(root)
          const tarballs = names.filter(name => name.endsWith('.tgz'))
          const offline = names.filter(name => name.endsWith('-offline.tar.gz'))
          if (tarballs.length !== 9 || offline.length !== 1) {
            throw new Error(`Expected 9 npm packages + 1 offline archive, found ${tarballs.length} and ${offline.length}`)
          }
          const files = [...tarballs, ...offline].sort()

          const artifacts = []
          const sums = []
          async function digest(path) {
            const hash = createHash('sha256')
            let size = 0
            for await (const chunk of createReadStream(path)) {
              hash.update(chunk)
              size += chunk.length
            }
            return { sha256: hash.digest('hex'), bytes: size }
          }
          for (const name of files) {
            const { sha256, bytes } = await digest(join(root, name))
            artifacts.push({ name, bytes, sha256 })
            sums.push(`${sha256}  ${name}`)
          }

          const lockfileName = 'resolved-pnpm-lock.yaml'
          const { sha256: lockfileSha256 } = await digest(join(root, lockfileName))
          sums.push(`${lockfileSha256}  ${lockfileName}`)

          const manifest = {
            schemaVersion: 1,
            resolvedLockfile: { name: lockfileName, sha256: lockfileSha256 },
            releaseLine: 'full-with-opts-in',
            offlineBundle: { name: offline[0], contains: ['precompiled web dependency closure', '11 Flyfish optional asset packs', 'Geo3D LAS/LAZ/3TZ/COG local decoders and workers', 'XML XSD/XSLT local WASM engines', '9 wrapper tarballs'] },
            upstreamReleaseTag: 'v3.2.2',
            upstreamRepository: 'flyfish-dev/file-viewer',
            sourceRepository: process.env.GITHUB_REPOSITORY,
            sourceRef: process.env.GITHUB_REF,
            sourceSha: process.env.GITHUB_SHA,
            generatedAt: new Date().toISOString(),
            cadRuntimePolicy: {
              excluded: true,
              forbiddenPackages: [
                '@file-viewer/renderer-cad',
                '@file-viewer/assets-cad',
                '@flyfish-dev/cad-viewer',
                'dwf-viewer'
              ]
            },
            artifacts
          }

          await writeFile(
            join(root, 'full-with-opts-in-manifest.json'),
            JSON.stringify(manifest, null, 2) + '\n'
          )
          await writeFile(join(root, 'SHA256SUMS.txt'), sums.join('\n') + '\n')
          console.log(`Verified ${tarballs.length} npm tarballs and ${offline.length} complete offline archive.`)
          NODE

      - name: Show packaged files
        env:
          OUT_DIR: ${{ runner.temp }}/full-with-opts-in-release
        run: |
          ls -lah "$OUT_DIR"
          cat "$OUT_DIR/SHA256SUMS.txt"

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-with-opts-in-${{ github.sha }}
          path: ${{ runner.temp }}/full-with-opts-in-release
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish full-with-opts-in GitHub prerelease
    needs: build
    if: github.ref == 'refs/heads/build/web-full-with-opts-in'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download and verify the build bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/full-with-opts-in-release
        run: |
          mkdir -p "$RELEASE_DIR"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "full-with-opts-in-$GITHUB_SHA" \
            --dir "$RELEASE_DIR"
          test "$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 9
          test "$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*-offline.tar.gz' | wc -l)" -eq 1
          test "$(stat -c '%s' "$RELEASE_DIR"/*-offline.tar.gz)" -gt 15000000
          test -s "$RELEASE_DIR/full-with-opts-in-manifest.json"
          test -s "$RELEASE_DIR/resolved-pnpm-lock.yaml"
          test -s "$RELEASE_DIR/SHA256SUMS.txt"
          (cd "$RELEASE_DIR" && sha256sum --check SHA256SUMS.txt)

      - name: Create branch-targeted GitHub prerelease (not npm)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/full-with-opts-in-release
          RELEASE_TAG: v3.2.2-full-with-opts-in-r2
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi

          notes="$RUNNER_TEMP/full-with-opts-in-release-notes.md"
          cat > "$notes" <<EOF
          ## File Viewer v3.2.2 — full-with-opts-in (complete Geo3D + XML)

          Built from branch build/web-full-with-opts-in at commit $GITHUB_SHA.
          The default branch is not modified.

          Contains nine npm package tarballs: the full-with-opts-in preset, Web,
          Vue 3, Vue 2.7, Vue 2.6, React, React Legacy, jQuery, and Svelte.
          These individual npm tarballs are dependency-aware, not standalone.

          The separate full-with-opts-in-offline.tar.gz contains the precompiled
          Web production dependency closure, all allowed optional runtime asset
          packs, same-version local Workers/WASM/fonts/vendor files, self-hosted
          Geo3D LAS/LAZ/COPC/GeoTIFF/COG/CityJSON/3D Tiles/3TZ decoders, XML
          XSD/XSLT WASM engines, and the nine wrapper tarballs. Refer to its README.md for installation and scope.

          Opt-ins: BPMN, DICOM, signatures/evidence, enhanced IFC, Adobe/design,
          binary inspector, XML profiles, Geo3D and the other explicitly opted-in capabilities.
          The AGPL-only CAD/DWG/DWF/DWFX runtime is intentionally excluded.

          SHA256SUMS.txt provides tarball and resolved-lockfile hashes.
          full-with-opts-in-manifest.json records the source commit and package list.
          resolved-pnpm-lock.yaml records the dependency resolution used by this build.

          This is a GitHub prerelease with build artifacts, not an npm publication.
          EOF

          gh release create "$RELEASE_TAG" \
            "$RELEASE_DIR"/*.tgz \
            "$RELEASE_DIR"/*-offline.tar.gz \
            "$RELEASE_DIR"/full-with-opts-in-manifest.json \
            "$RELEASE_DIR"/SHA256SUMS.txt \
            "$RELEASE_DIR"/resolved-pnpm-lock.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "File Viewer v3.2.2 — full-with-opts-in (Geo3D + XML)" \
            --notes-file "$notes" \
            --prerelease \
            --latest=false
